# Real-CUGAN 默认配置
# 优先级：本文件 < 环境变量 / .env < 命令行参数
# 环境变量命名：REAL_CUGAN_ + 字段名大写，嵌套字段用双下划线，如 REAL_CUGAN_VIDEO__NT

# ------------------------- 模型推理（图像 / 视频共用） -------------------------
# 超分倍率，2 / 3 / 4
scale: 2

# 降噪档位，权重文件名里的档位名：
#   no-denoise    原片噪声不多，只想提分辨率/清晰度
#   denoise1x     轻度降噪
#   denoise2x     中度降噪（仅 2x 权重提供）
#   denoise3x     强降噪，压得烂的片子选它（默认）
#   conservative  保守版，尽量不改画风/纹理
denoise: denoise3x

# 自定义权重路径；留空则按 scale + denoise 从 weights_v3/ 自动匹配
weights: null

# 分块数量：越大越省显存、越慢；0 = 整图推理
tile: 5

# 显存 / 速度权衡：
#   0 正常缓存
#   1 缓存做 8bit 量化，省显存，耗时 +15%
#   2 fast_rough 模式，约 1.7G 显存可跑任意分辨率，耗时 +25%
#   3 gap_sync 模式，无损低显存，耗时 +150%
cache_mode: 1

# 处理强度：越大 AI 痕迹越少、越模糊；越小越锐化、色偏越明显
# 推荐区间 (0.75, 1.3)，1.0 为不调整
alpha: 1.0

# 半精度推理，省显存；>=20 系 N 卡建议开启，CPU 上会自动关闭
half: true

# 推理设备：cuda:0 / cuda:1 / cpu（视频命令按 n_gpu 自动分配到 cuda:i）
device: cuda:0

# ------------------------------ 图像超分命令 ------------------------------
image:
  # 输入图片或目录，支持 png/jpg/jpeg/bmp/webp/tif
  input: inputs
  # 输出目录，不存在会自动创建
  output_dir: output

# ------------------------------ 视频超分命令 ------------------------------
video:
  # 输入视频与输出视频路径，必须指定（也可用命令行 -i / -o）
  input: null
  output: null
  # 每张显卡上的推理线程数：太小利用率低，太大爆显存
  nt: 2
  # 使用的显卡数量
  n_gpu: 1
  # 多线程推理时每帧的随机休眠区间，避免线程互相抢占
  p_sleep: [0.005, 0.012]
  # 解帧后主线程休眠时间，避免解帧占满 CPU
  decode_sleep: 0.002
  # 传给 ffmpeg 的编码参数：crf 越低码率越高画质越好；
  # preset 越慢画质越好、越吃 CPU（ultrafast … slow）
  encode_params: ["-crf", "21", "-preset", "medium"]
